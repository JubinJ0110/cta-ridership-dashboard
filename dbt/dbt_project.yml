name: cta_ridership
version: 1.0.0
config-version: 2

# dbt project for the CTA ridership dashboard data.
# Runs locally against DuckDB; the raw data lives in the SQLite file
# maintained by fetch_ridership.py (attached read-only, never modified).
profile: cta_ridership

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "dev.duckdb"
  - "logs"

models:
  cta_ridership:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
